<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .left-section {
      background-color: #1a2b44;
      width: 50%;
    }
    .right-section {
      background-color: #f47522;
      width: 50%;

    .content {

      background-color: #ffffff;
      top: 50%;

      color: black;
    }
    .navigation a.active,
    .navigation a:hover {
      color: orange;
    }
    .profile-picture {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 5px solid orange;
      margin: 0 auto;
    }
    .name {
        margin-top: 10%;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .name span {
      color: orange;
    }
    .designation {
      font-size: 1.2rem;
      font-weight: bold;
      color: orange;
      margin-top: 5px;
    }
    .description {
        
      background-color: #d4d3fc;
      padding: 15px;
      border-radius: 10px;
      color: #333;
      margin-top: 15%;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="content">

      <div class="navigation">

      <img src="C:\Users\sethu\Videos\sethu.jpg" alt="Profile Picture" class="profile-picture">

      <!-- Name and Designation -->
      <h1 class="name">Hi I am <span>Sethuragavan K K</span></h1>

      <div class="description">
